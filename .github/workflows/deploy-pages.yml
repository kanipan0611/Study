name: Deploy to GitHub Pages

# gh-pages ブランチに現在のコミットを同期する方式。
# gh-pages ブランチの存在により GitHub Pages が自動的に有効化・公開される。
on:
  push:
    branches:
      - main
      - claude/learning-app-architecture-1x2a0h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current commit to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
